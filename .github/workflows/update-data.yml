# Weekly data refresh and GitHub Pages deploy, as one job.
# Order: test, build data, build site, upload, deploy, and only then commit the data.
# Any failing step (tests, a Source fetch, the safety rails in scripts/job.js, the deploy) stops the run:
# nothing is committed, and the run turns red so GitHub notifies the maintainer.
name: Update data and deploy

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    timeout-minutes: 120 # the first run takes ~80 minutes (Leaping Bunny detail pages, 2 s apart)
    permissions:
      contents: write # push the data commit
      pages: write # deploy to GitHub Pages
      id-token: write # Pages deploy authenticates with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm test
      - run: npm run build-data
      - run: npm run build-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Commit the dataset and Leaping Bunny cache
        run: |
          git add data/dataset.json data/lb-details.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(data): weekly refresh $(date -u +%F)"
            git push
          fi
